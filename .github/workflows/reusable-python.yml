name: Reusable Python validation

on:
  workflow_call:
    inputs:
      working-directory:
        description: Repository-relative directory containing Python source
        type: string
        required: false
        default: "."
      python-version:
        description: Exact Python version to use
        type: string
        required: false
        default: "3.12"
      test-path:
        description: Test path relative to the working directory
        type: string
        required: false
        default: "tests"
      dependency-file:
        description: Optional requirements file relative to the working directory
        type: string
        required: false
        default: ""
      install-project:
        description: Install the validated project before checks
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Python validation
    runs-on: ubuntu-24.04
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      PYTHON_VERSION: ${{ inputs.python-version }}
      TEST_PATH: ${{ inputs.test-path }}
      DEPENDENCY_FILE: ${{ inputs.dependency-file }}
      INSTALL_PROJECT: ${{ inputs.install-project }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install pinned validation tools
        shell: bash
        run: |
          set -euo pipefail
          safe_path=$(realpath -- "$WORKING_DIRECTORY")
          case "$safe_path" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
            *) printf 'Working directory is outside the checkout\n' >&2; exit 2 ;;
          esac
          if [[ -n "$DEPENDENCY_FILE" ]]; then
            safe_dependency_file=$(realpath -- "$safe_path/$DEPENDENCY_FILE")
            case "$safe_dependency_file" in
              "$safe_path"|"$safe_path"/*) ;;
              *) printf 'Dependency file is outside the working directory\n' >&2; exit 2 ;;
            esac
            if [[ ! -f "$safe_dependency_file" ]]; then
              printf 'Dependency file does not exist or is not a file\n' >&2
              exit 2
            fi
            python -m pip install --requirement "$safe_dependency_file"
          fi
          case "$INSTALL_PROJECT" in
            true)
              if [[ ! -f "$safe_path/pyproject.toml" && ! -f "$safe_path/setup.py" ]]; then
                printf 'Project installation requested, but no project metadata exists\n' >&2
                exit 2
              fi
              python -m pip install "$safe_path"
              ;;
            false) ;;
            *) printf 'install-project must be true or false\n' >&2; exit 2 ;;
          esac
          python -m pip install --disable-pip-version-check ruff==0.12.11 pytest==8.4.1 PyYAML==6.0.2

      - name: Check Python format
        shell: bash
        run: |
          set -euo pipefail
          safe_path=$(realpath -- "$WORKING_DIRECTORY")
          case "$safe_path" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
            *) printf 'Working directory is outside the checkout\n' >&2; exit 2 ;;
          esac
          cd -- "$safe_path"
          ruff format --check .

      - name: Lint Python source
        shell: bash
        run: |
          set -euo pipefail
          safe_path=$(realpath -- "$WORKING_DIRECTORY")
          case "$safe_path" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
            *) printf 'Working directory is outside the checkout\n' >&2; exit 2 ;;
          esac
          cd -- "$safe_path"
          ruff check .

      - name: Run Pytest tests
        shell: bash
        run: |
          set -euo pipefail
          safe_path=$(realpath -- "$WORKING_DIRECTORY")
          case "$safe_path" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
            *) printf 'Working directory is outside the checkout\n' >&2; exit 2 ;;
          esac
          safe_test_path=$(realpath -- "$safe_path/$TEST_PATH")
          case "$safe_test_path" in
            "$safe_path"|"$safe_path"/*) ;;
            *) printf 'Test path is outside the working directory\n' >&2; exit 2 ;;
          esac
          cd -- "$safe_path"
          pytest "$safe_test_path"
