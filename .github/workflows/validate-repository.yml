name: Validate repository

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run-validations:
        description: Run all validation examples in a repository that provides matching source trees
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  repository-quality:
    name: Repository policy and workflow quality
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install repository test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.1 PyYAML==6.0.2

      - name: Run repository policy tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest

      - name: Install checksum-verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          checksum_file="$RUNNER_TEMP/actionlint.sha256"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" > "$checksum_file"
          sha256sum --check --status "$checksum_file"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" actionlint

      - name: Lint GitHub workflows
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/actionlint" -color=false

  terraform:
    name: Terraform reusable workflow example
    if: github.event_name == 'workflow_dispatch' && inputs.run-validations
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      working-directory: examples/terraform
      terraform-version: "1.9.7"

  powershell-validation:
    name: PowerShell reusable workflow example
    if: github.event_name == 'workflow_dispatch' && inputs.run-validations
    uses: ./.github/workflows/reusable-powershell.yml
    with:
      working-directory: examples/powershell
      powershell-version: "7.4"
      test-path: tests

  python:
    name: Python reusable workflow example
    if: github.event_name == 'workflow_dispatch' && inputs.run-validations
    uses: ./.github/workflows/reusable-python.yml
    with:
      working-directory: examples/python
      python-version: "3.12"
      test-path: tests
      dependency-file: ""
      install-project: false
