name: Reusable Terraform validation

on:
  workflow_call:
    inputs:
      working-directory:
        description: Repository-relative directory containing Terraform configuration
        type: string
        required: false
        default: "."
      terraform-version:
        description: Exact Terraform CLI version to use
        type: string
        required: false
        default: "1.9.7"

permissions:
  contents: read

jobs:
  validate:
    name: Terraform validation
    runs-on: ubuntu-24.04
    env:
      WORKING_DIRECTORY: ${{ inputs.working-directory }}
      TERRAFORM_VERSION: ${{ inputs.terraform-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: "v0.58.1"

      - name: Check Terraform format
        shell: bash
        run: |
          set -euo pipefail
          safe_path=$(realpath -- "$WORKING_DIRECTORY")
          case "$safe_path" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
            *) printf 'Working directory is outside the checkout\n' >&2; exit 2 ;;
          esac
          cd -- "$safe_path"
          terraform fmt -check -recursive

      - name: Initialize Terraform without a backend
        shell: bash
        run: |
          set -euo pipefail
          safe_path=$(realpath -- "$WORKING_DIRECTORY")
          case "$safe_path" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
            *) printf 'Working directory is outside the checkout\n' >&2; exit 2 ;;
          esac
          cd -- "$safe_path"
          terraform init -backend=false -input=false

      - name: Lint Terraform configuration
        shell: bash
        run: |
          set -euo pipefail
          safe_path=$(realpath -- "$WORKING_DIRECTORY")
          case "$safe_path" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
            *) printf 'Working directory is outside the checkout\n' >&2; exit 2 ;;
          esac
          cd -- "$safe_path"
          tflint --recursive

      - name: Validate Terraform configuration
        shell: bash
        run: |
          set -euo pipefail
          safe_path=$(realpath -- "$WORKING_DIRECTORY")
          case "$safe_path" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) ;;
            *) printf 'Working directory is outside the checkout\n' >&2; exit 2 ;;
          esac
          cd -- "$safe_path"
          terraform validate
