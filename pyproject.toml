[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-cicd-reference-platform"
version = "0.1.0"
description = "Static contract tests for reusable validation pipelines"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "PyYAML>=6.0.2,<7",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "github: GitHub workflow contracts; during Task 2 run: pytest -m 'github or policy'",
  "azure: Azure Pipelines contracts; during Task 3 run: pytest -m 'azure or policy'",
  "policy: repository-wide parsing and validation-only safety contracts",
  "selftest: adversarial unit tests for the contract-test helpers",
]
