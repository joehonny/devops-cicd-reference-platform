[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-cicd-reference-platform"
version = "0.1.0"
description = "Static contract tests for reusable validation pipelines"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "PyYAML>=6.0.2,<7",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

